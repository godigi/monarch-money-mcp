name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # stuck-job guard, 2026-10-25
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest test_security test_hardening -q
      - run: python -m unittest test_transaction_tools test_rule_management test_attachments test_tool_schema test_local_receipts -q
      - run: python test_github_allowlist.py
